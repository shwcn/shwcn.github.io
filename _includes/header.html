<header id="hero-header">
  <div class="container hero-container">
    
    <!-- Left: Profile Image -->
    <div class="hero-left">
      <img class="hero-pic" src="img/Picture1.png" alt="profile-pic">
    </div>

    <!-- Right: Name + Skills -->
    <div class="hero-right">
      <h1 class="hero-name">{{ site.title }}</h1>
      <div class="hero-underline"></div>
      <p class="hero-skills">{{ site.skills }}</p>
    </div>

  </div>
</header>
